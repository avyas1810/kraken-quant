name: Tests and compilation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-ci.txt -r requirements-research.txt -r requirements-notebook.txt
      - name: All tests (synthetic and mocked, no exchange keys)
        run: python -m pytest -q tests
      - name: Research notebook clean-kernel offline integration
        run: python examples/execute_research_notebook.py --notebook "notebooks/First trial.ipynb" --fixture
      - name: Verify current historical result artifacts (no raw inputs required)
        run: python -m research.phase2.verify_results --results phase2_results/reviewed_20261016
      - name: Compile every tracked Python source without writing repository bytecode
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/compile-cache
        run: python -c "import pathlib, py_compile, subprocess; [py_compile.compile(str(p), doraise=True) for p in map(pathlib.Path, subprocess.check_output(['git', 'ls-files', '*.py'], text=True).splitlines())]"
